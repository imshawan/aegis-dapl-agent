name: Enterprise CI Build & Test Harness

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Type Verification & Native Diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Clean Install Dependencies
      run: npm ci

    - name: TypeScript Type Verification
      run: npm run typecheck

    - name: Execute Native Test Harness Suite
      run: npm run test
      env:
        NODE_ENV: test
        LLM_QUERY_TIMEOUT_MS: 3000
