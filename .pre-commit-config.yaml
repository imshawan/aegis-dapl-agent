# .pre-commit-config.yaml
# Automated pre-commit hooks for Aegis: Enforces secret scanning, conventional commits, and file integrity before commit.
# To install locally: pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg

repos:
  # 1. Standard file hygiene and conflict checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # 2. Automated Secret Scanning with Gitleaks (Uses .gitleaks.toml allowlist rules)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # 3. Conventional Commits Enforcement (Uses .commitlintrc.json rules)
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
