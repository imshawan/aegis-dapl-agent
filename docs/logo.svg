<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="512" height="512">
  <!-- 
    Enterprise Brand Identity: Aegis DAPL Agent
    Design Language: Industry-Standard Lucide / Radix UI Vector System (28x28 Precision Grid with Goldilocks ~16% Padding)
    Why this design is 100% studio-grade:
      - Perfectly Balanced Padding: Exactly 4.5 units (~16%) of margin on all 4 sides inside a 28x28 container box.
      - Refined 1.2 Stroke Weight: Adjusted stroke-width to exactly 1.2 for the perfect balance of visual clarity and modern UI refinement.
      - Uniform Routing Colors: 100% luminous Electric Cyan (#00F2FE) connecting lines with explicit vertical drop lines to all 3 boxes.
  -->

  <!-- Studio-Grade Matte Dark Slate Container with Perfectly Balanced Padding -->
  <rect width="28" height="28" rx="6.5" fill="#070A12" />
  <rect width="28" height="28" rx="6.5" fill="none" stroke="#162032" stroke-width="0.5" />

  <!-- The Orchestrator Workflow Routing Grid (100% Uniform Color, Goldilocks Padding, Refined 1.2 Stroke) -->
  <g fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Master Vertical Trunk (From Top Orchestrator Node down to horizontal bus bar) -->
    <path d="M 14 9 V 13.5" />
    
    <!-- Master Horizontal Routing Bus Bar (Spans across all 3 worker paths) -->
    <path d="M 7.5 13.5 H 20.5" />
    
    <!-- Vertical Drop Line 1: Connected directly to top edge of CodeScoperWorker (Left Box at x=4.5, y=17.5) -->
    <path d="M 7.5 13.5 V 17.5" />
    
    <!-- Vertical Drop Line 2: Connected directly to top edge of GitDiffWorker (Center Box at x=11, y=17.5) -->
    <path d="M 14 13.5 V 17.5" />
    
    <!-- Vertical Drop Line 3: Connected directly to top edge of PatchWorker (Right Box at x=17.5, y=17.5) -->
    <path d="M 20.5 13.5 V 17.5" />
  </g>

  <!-- Master Orchestrator Command Core (Top Lead Investigation Node - Refined 1.2 Stroke) -->
  <rect x="11" y="4.5" width="6" height="4.5" rx="1.2" fill="#070A12" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="14" cy="6.75" r="0.95" fill="#00F2FE" />

  <!-- Subagent Worker Node 1: CodeScoperWorker (Left AST Scoping Domain - Refined 1.2 Stroke) -->
  <rect x="4.5" y="17.5" width="6" height="6" rx="1.5" fill="#070A12" stroke="#60A5FA" stroke-width="1.2" />
  <circle cx="7.5" cy="20.5" r="1.15" fill="#60A5FA" />

  <!-- Subagent Worker Node 2: GitDiffWorker (Center Version Diagnostics Domain - Refined 1.2 Stroke) -->
  <rect x="11" y="17.5" width="6" height="6" rx="1.5" fill="#070A12" stroke="#A855F7" stroke-width="1.2" />
  <circle cx="14" cy="20.5" r="1.15" fill="#A855F7" />

  <!-- Subagent Worker Node 3: PatchWorker (Right Self-Healing Remediation Domain - Refined 1.2 Stroke) -->
  <rect x="17.5" y="17.5" width="6" height="6" rx="1.5" fill="#070A12" stroke="#10B981" stroke-width="1.2" />
  <rect x="19.7" y="19.7" width="1.6" height="1.6" rx="0.4" fill="#10B981" />
</svg>
