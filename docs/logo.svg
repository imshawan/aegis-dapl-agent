<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="gradVioletBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#2575FC" />
    </linearGradient>
    <linearGradient id="gradEmeraldCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A67D" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Glassmorphic Backdrop Orb -->
  <circle cx="256" cy="256" r="230" fill="#0B0F19" opacity="0.96" />
  <circle cx="256" cy="256" r="228" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- 3 Interlocking Neon Orbital Arcs (Representing Autonomous ReAct Loops & Worker Subagents) -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#gradCyanBlue)" stroke-width="5" transform="rotate(-30 256 256)" opacity="0.75" filter="url(#neonGlow)" />
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#gradVioletBlue)" stroke-width="5" transform="rotate(30 256 256)" opacity="0.75" filter="url(#neonGlow)" />
  <ellipse cx="256" cy="256" rx="70" ry="180" fill="none" stroke="url(#gradEmeraldCyan)" stroke-width="5" transform="rotate(90 256 256)" opacity="0.75" filter="url(#neonGlow)" />

  <!-- 3D Isometric Cybernetic Crystal Core (Representing the DAPL Orchestrator Engine) -->
  <g transform="translate(256 256)">
    <!-- Top Face -->
    <polygon points="0,-88 76,-44 0,0 -76,-44" fill="url(#gradCyanBlue)" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="-76,-44 0,0 0,88 -76,44" fill="url(#gradVioletBlue)" opacity="0.95" />
    <!-- Right Face -->
    <polygon points="0,0 76,-44 76,44 0,88" fill="url(#gradEmeraldCyan)" opacity="0.85" />
    
    <!-- Precision Wireframe Highlights -->
    <polygon points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" />
    <line x1="0" y1="0" x2="0" y2="-88" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
    <line x1="0" y1="0" x2="-76" y2="44" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
    <line x1="0" y1="0" x2="76" y2="44" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Glowing Satellite Checkpoint Nodes (Representing CodeScoperWorker, GitDiffWorker, and PatchWorker) -->
  <circle cx="100" cy="166" r="12" fill="#00F2FE" filter="url(#neonGlow)" />
  <circle cx="412" cy="166" r="12" fill="#2575FC" filter="url(#neonGlow)" />
  <circle cx="256" cy="436" r="14" fill="#00A67D" filter="url(#neonGlow)" />
  
  <circle cx="100" cy="166" r="4" fill="#FFFFFF" />
  <circle cx="412" cy="166" r="4" fill="#FFFFFF" />
  <circle cx="256" cy="436" r="5" fill="#FFFFFF" />

  <!-- Central AI Singularity Pulsar Core -->
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="10" fill="#00F2FE" />
</svg>
